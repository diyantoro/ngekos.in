name: ngekos_in
description: "Ngekos.in - Aplikasi Pencari Kos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  permission_handler: 12.0.1
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  fl_chart: ^1.2.0
  image_cropper: ^12.2.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dependency_overrides:
  image_cropper_for_web:
    path: packages/image_cropper_for_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
